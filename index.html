<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyblade X - Genesis Deck Builder</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --warning: #f59e0b;
            --cx-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .budget-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .budget-info h2 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .budget-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .budget-value-box {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--accent);
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .bey-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .bey-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bey-title-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bey-title {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: bold;
            text-transform: uppercase;
        }

        .cx-toggle-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--cx-color);
            background: #0369a120;
            border: 1px solid #0284c740;
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            user-select: none;
            font-weight: 600;
        }

        .cx-toggle-label input {
            cursor: pointer;
            accent-color: var(--cx-color);
        }

        .bey-points {
            font-size: 0.9rem;
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .select-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .field-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-group.cx-field label {
            color: var(--cx-color);
        }

        select {
            width: 100%;
            padding: 9px 10px;
            background-color: #ffffff;
            color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
        }

        select option {
            background-color: #ffffff;
            color: #000000;
        }

        .stats-bar {
            position: sticky;
            bottom: 20px;
            background: #1e293be6;
            backdrop-filter: blur(10px);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .stats-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .stats-text {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .badge-success {
            background: #22c55e20;
            color: #4ade80;
            border: 1px solid #22c55e40;
        }

        .badge-warning {
            background: #ef444420;
            color: #f87171;
            border: 1px solid #ef444440;
        }

        .btn-copy {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: var(--accent-hover);
        }
    </style>
</head>

    const RAW_RATCHETS = [
      {"name": "0-60", "punti": 0}, {"name": "0-70", "punti": 0}, {"name": "0-80", "punti": 0},
      {"name": "1-50", "punti": 1}, {"name": "1-60", "punti": 2}, {"name": "1-70", "punti": 1},
      {"name": "1-80", "punti": 1}, {"name": "2-60", "punti": 0}, {"name": "2-70", "punti": 0},
      {"name": "2-80", "punti": 0}, {"name": "3-60", "punti": 1}, {"name": "3-70", "punti": 0},
      {"name": "3-80", "punti": 0}, {"name": "3-85", "punti": 0}, {"name": "4-50", "punti": 0},
      {"name": "4-55", "punti": 0}, {"name": "4-60", "punti": 0}, {"name": "4-70", "punti": 0},
      {"name": "4-80", "punti": 0}, {"name": "5-50", "punti": 0}, {"name": "5-60", "punti": 1},
      {"name": "5-70", "punti": 0}, {"name": "5-80", "punti": 0}, {"name": "6-60", "punti": 0},

      {"name": "7-60", "punti": 1}, {"name": "7-70", "punti": 1}, {"name": "7-80", "punti": 0},
      {"name": "8-70", "punti": 0}, {"name": "8-80", "punti": 0}, {"name": "9-60", "punti": 2},
      {"name": "9-65", "punti": 0}, {"name": "9-70", "punti": 1}, {"name": "9-80", "punti": 0},
      {"name": "M-85", "punti": 0}
    ];

    function sortByName(array) {
        return array.sort((a, b) => a.nome.localeCompare(b.nome));
    }

    function elaboraPezzi() {
        let mainStandardMap = {};
        let mainCXMap = {};
        let assistList = [];
        let overList = [];

        RAW_BLADES.forEach(b => {
            let pts = (b.punti !== undefined) ? b.punti : 0;
            let item = { nome: b.name, punti: pts };
            if (b.type === "Assistblade") {
                assistList.push(item);
            } else if (b.type === "Overblade") {
                overList.push(item);
            } else {
                let sys = b.system || "Altri";
                if (sys === "CX") {
                    if (!mainCXMap[sys]) mainCXMap[sys] = [];
                    mainCXMap[sys].push(item);
                } else {
                    if (!mainStandardMap[sys]) mainStandardMap[sys] = [];
                    mainStandardMap[sys].push(item);
                }
            }
        });

        Object.keys(mainStandardMap).forEach(sys => sortByName(mainStandardMap[sys]));
        Object.keys(mainCXMap).forEach(sys => sortByName(mainCXMap[sys]));

        let assistsSorted = sortByName(assistList);
        assistsSorted.unshift({ nome: "", etichetta: "Nessuno", punti: 0 });

        let oversSorted = sortByName(overList);
        oversSorted.unshift({ nome: "", etichetta: "Nessuno", punti: 0 });

        let ratchetList = RAW_RATCHETS.map(r => ({ nome: r.name, punti: (r.punti !== undefined) ? r.punti : 0 }));
        sortByName(ratchetList);
        ratchetList.unshift({ nome: "Nessuno (Integrato)", etichetta: "Nessuno / Integrato", punti: 0 });

        let bitMap = {};
        RAW_BITS.forEach(bt => {
            let type = bt.combatType ? (bt.combatType.charAt(0).toUpperCase() + bt.combatType.slice(1).toLowerCase()) : "Altri";
            let pts = (bt.punti !== undefined) ? bt.punti : 0;
            if (!bitMap[type]) bitMap[type] = [];
            bitMap[type].push({ nome: bt.name, punti: pts });
        });

        Object.keys(bitMap).forEach(type => sortByName(bitMap[type]));

        return {
            chips: [
                { nome: "", etichetta: "Nessuno", punti: 0 },
                { nome: "Plastic Chip", punti: 0 },
                { nome: "Metal Chip", punti: 1 }
            ],
            mainStandardGrouped: mainStandardMap,
            mainCXGrouped: mainCXMap,
            assists: assistsSorted,
            overs: oversSorted,
            ratchets: ratchetList,
            bitGrouped: bitMap
        };
    }

    const DATABASE_PEZZI = elaboraPezzi();

    function popoloSelectFlat(selectElement, items) {
        selectElement.innerHTML = "";
        items.forEach(item => {
            let opt = document.createElement("option");
            opt.value = item.nome;
            let displayNome = item.etichetta || item.nome;
            opt.textContent = `${displayNome} (${item.punti} pt)`;
            opt.setAttribute("data-punti", item.punti);
            selectElement.appendChild(opt);
        });
    }

    function popoloSelectGrouped(selectElement, groupedData, orderKeys = null) {
        selectElement.innerHTML = "";
        let keys = orderKeys || Object.keys(groupedData).sort();
        
        keys.forEach(key => {
            if (groupedData[key] && groupedData[key].length > 0) {
                let groupEl = document.createElement("optgroup");
                groupEl.label = `--- ${key} ---`;
                
                groupedData[key].forEach(item => {
                    let opt = document.createElement("option");
                    opt.value = item.nome;
                    let displayNome = item.etichetta || item.nome;
                    opt.textContent = `${displayNome} (${item.punti} pt)`;
                    opt.setAttribute("data-punti", item.punti);
                    groupEl.appendChild(opt);
                });
                
                selectElement.appendChild(groupEl);
            }
        });
    }

    function aggiornaBladeSelect(index) {
        let card = document.getElementById('card-bey' + index);
        let isCXActive = card.querySelector('.cx-checkbox').checked;
        let bladeSelect = card.querySelector('.blade-select');

        if (isCXActive) {
            popoloSelectGrouped(bladeSelect, DATABASE_PEZZI.mainCXGrouped, ["CX"]);
        } else {
            popoloSelectGrouped(bladeSelect, DATABASE_PEZZI.mainStandardGrouped, ["BX", "UX", "XO"]);
        }
    }

    function inizializzaApp() {
        document.getElementById('sogliaDisplay').innerText = SOGLIA_PUNTI_TORNEO;
        document.getElementById('budgetDisplay').innerText = SOGLIA_PUNTI_TORNEO;

        for (let i = 1; i <= 3; i++) {
            let card = document.getElementById(`card-bey${i}`);
            
            popoloSelectFlat(card.querySelector('.chip-select'), DATABASE_PEZZI.chips);
            aggiornaBladeSelect(i);
            popoloSelectFlat(card.querySelector('.assist-select'), DATABASE_PEZZI.assists);
            popoloSelectFlat(card.querySelector('.over-select'), DATABASE_PEZZI.overs);
            popoloSelectFlat(card.querySelector('.ratchet-select'), DATABASE_PEZZI.ratchets);
            popoloSelectGrouped(card.querySelector('.bit-select'), DATABASE_PEZZI.bitGrouped, ["Attack", "Defense", "Stamina", "Balance"]);
            
            if (i === 2 && card.querySelector('.blade-select').options.length > 1) {
                card.querySelector('.blade-select').selectedIndex = 1;
                card.querySelector('.ratchet-select').selectedIndex = 1;
                card.querySelector('.bit-select').selectedIndex = 1;
            } else if (i === 3 && card.querySelector('.blade-select').options.length > 2) {
                card.querySelector('.blade-select').selectedIndex = 2;
                card.querySelector('.ratchet-select').selectedIndex = 2;
                card.querySelector('.bit-select').selectedIndex = 2;
            }
        }
        calcolaTotale();
    }

    function toggleCX(index) {
        let card = document.getElementById('card-bey' + index);
        let checkbox = card.querySelector('.cx-checkbox');
        let cxFields = card.querySelectorAll('.cx-group-' + index);

        cxFields.forEach(field => {
            if (checkbox.checked) {
                field.style.display = 'block';
            } else {
                field.style.display = 'none';
                let select = field.querySelector('select');
                if (select) select.selectedIndex = 0;
            }
        });

        // Aggiorna dinamicamente la lista delle Main Blade
        aggiornaBladeSelect(index);

        calcolaTotale();
    }

    function calcolaTotale() {
        let budget = SOGLIA_PUNTI_TORNEO;
        let cards = document.querySelectorAll('.bey-card');
        let totalePuntiDeck = 0;

        cards.forEach((card, index) => {
            let isCXActive = card.querySelector('.cx-checkbox').checked;

            let chip = card.querySelector('.chip-select');
            let blade = card.querySelector('.blade-select');
            let assist = card.querySelector('.assist-select');
            let over = card.querySelector('.over-select');
            let ratchet = card.querySelector('.ratchet-select');
            let bit = card.querySelector('.bit-select');

            let pChip = (isCXActive && chip && chip.selectedIndex >= 0) ? (parseInt(chip.options[chip.selectedIndex].getAttribute('data-punti')) || 0) : 0;
            let pBlade = (blade && blade.selectedIndex >= 0) ? (parseInt(blade.options[blade.selectedIndex].getAttribute('data-punti')) || 0) : 0;
            let pAssist = (isCXActive && assist && assist.selectedIndex >= 0) ? (parseInt(assist.options[assist.selectedIndex].getAttribute('data-punti')) || 0) : 0;
            let pOver = (isCXActive && over && over.selectedIndex >= 0) ? (parseInt(over.options[over.selectedIndex].getAttribute('data-punti')) || 0) : 0;
            let pRatchet = (ratchet && ratchet.selectedIndex >= 0) ? (parseInt(ratchet.options[ratchet.selectedIndex].getAttribute('data-punti')) || 0) : 0;
            let pBit = (bit && bit.selectedIndex >= 0) ? (parseInt(bit.options[bit.selectedIndex].getAttribute('data-punti')) || 0) : 0;

            let totaleBey = pChip + pBlade + pAssist + pOver + pRatchet + pBit;
            document.getElementById('pts-bey' + (index + 1)).innerText = totaleBey;

            totalePuntiDeck += totaleBey;
        });

        document.getElementById('puntiTotali').innerText = totalePuntiDeck;

        let badge = document.getElementById('statusBadge');
        if (totalePuntiDeck > budget) {
            badge.innerText = "SOGLIA SUPERATA";
            badge.className = "status-badge badge-warning";
        } else {
            badge.innerText = "DECK VALIDO";
            badge.className = "status-badge badge-success";
        }
    }

    function copiaDeck() {
        let budget = SOGLIA_PUNTI_TORNEO;
        let totale = document.getElementById('puntiTotali').innerText;
        let cards = document.querySelectorAll('.bey-card');

        let testo = `🌀 *MY BEYBLADE X DECK* 🌀\n`;
        testo += `📊 Punti: ${totale}/${budget}\n\n`;

        cards.forEach((card, i) => {
            let isCXActive = card.querySelector('.cx-checkbox').checked;

            let chip = card.querySelector('.chip-select').value;
            let blade = card.querySelector('.blade-select').value;
            let assist = card.querySelector('.assist-select').value;
            let over = card.querySelector('.over-select').value;
            let ratchet = card.querySelector('.ratchet-select').value;
            let bit = card.querySelector('.bit-select').value;

            let parti = [];
            if (isCXActive && chip) parti.push(`[${chip}]`);
            parti.push(blade);
            if (isCXActive && assist) parti.push(`+ ${assist}`);
            if (isCXActive && over) parti.push(`+ ${over}`);
            if (ratchet !== "Nessuno (Integrato)") parti.push(ratchet);
            parti.push(bit);

            testo += `${i+1}️⃣ ${parti.join(' ')}\n`;
        });

        navigator.clipboard.writeText(testo).then(() => {
            alert("Deck copiato negli appunti!");
        }).catch(() => {
            alert("Errore durante la copia negli appunti.");
        });
    }

    // Avvio iniziale dell'applicazione
    inizializzaApp();
</script>
